<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        td {
            width:80px;
            height:50px;
            padding: 0;
            text-align:center;
        }
        .dark{
            background-color:rgb(26, 22, 22);
            color:white;
        }
        .grey{
            background-color:grey;
        }
        .light{
            background-color:rgb(189, 187, 187)
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="dark"></td>
            <td class="dark">Monday</td>
            <td class="dark">Tuesday</td>
            <td class="dark">Wednesday</td>
        </tr>
        <tr>
            <td class="dark">1PM</td>
            <td class="grey">Math</td>
            <td class="grey">Science</td>
            <td class="grey">Art</td>
        </tr>
        <tr>
            <td class="dark">2PM</td>
            <td class="light">Science</td>
            <td class="light">Writing</td>
            <td class="light">Reading</td>
        </tr>
    </table>
</body>
</html>
