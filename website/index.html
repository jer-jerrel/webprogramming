<!DOCTYPE html>
<html>
<head>
  <style>
    .navbar {
      list-style-type: none;
      margin: 0;
      padding: 0;
      background-color: green;
      overflow: hidden;
    }

    .navbar li {
      float: left;
    }

    .navbar a {
      display: block;
      color: white;
      text-align: center;
      padding: 16px;
      text-decoration: underline wavy white;
    }

    .navbar a:hover {
      background-color: black;
    }

    .navbar a:active {
      background-color: blue;
    }
  </style>
</head>
<body>

  <h2>Navigation Menu</h2>
  <p>In this example, we use CSS to style the list horizontally, to create a navigation menu:</p>

  <ul class="navbar">
    <li><a href="index.html">Home</a></li>
    <li><a href="/about/jazz.html">Jazz</a></li>
    <li><a href="week3.html">Own</a></li>
    <li><a href="/news/week4.html">Menu</a></li>
    <li><a href="#about">About</a></li>
  </ul>

</body>
</html>
